logging:
    # env LOGGING_LEVEL
    level: trace # trace, debug, info, warn, error
    # env LOGGING_SINK
    sink: stderr # stderr, file, TODO
server: # Server configuration
    # env SERVER_LISTEN_ADDRESS 
    listenAddress: "https://0.0.0.0:8080" # Eg. http://{ip}:{port}, https://{ip}:{port}, {ip} 0.0.0.0 for all interfaces
    # env SERVER_INGRESS_CIDR
    ingressCIDR:
        - 0.0.0.0/0
        
db: # Database
    #env DB_SERVER
    server: "localhost"
    #env DB_PORT
    port: 5432
    user: "postgres"
    password: "password"
    # env DB_CONNECTION_STRING
    connectionString: "host=$ port=5432 user=$ password=$ dbname=pos_digital_receipt sslmode=disable search_path=s_kon_template_schema"
    # env DB_INIT_CONNECT_RETRIES
    initConnectRetries: 1800
    # env DB_INIT_CONNECT_LIMIT_LOG
    initConnectLimitLog: 5
    # env DB_INIT_CONNECT_SLEEP
    initConnectSleep: 1s
